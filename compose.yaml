services:
  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: market_anomaly_agent
      POSTGRES_DB: market_anomaly_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_anomaly_agent -d market_anomaly_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
